<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Dijital İkiz</title>
  <meta name="description" content="Yer şekilleri, tarih ve coğrafyayı gösteren interaktif 3B rehber haritası. İnternet olmadan da çalışır.">
  <meta name="theme-color" content="#0e1a26">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    { "imports": {
        "three": "./vendor/three.module.min.js",
        "three/addons/": "./vendor/addons/"
    } }
  </script>
</head>
<body>
  <canvas id="scene" aria-label="3B harita"></canvas>

  <header class="brand">
    <div class="brand-mark" aria-hidden="true"></div>
    <div>
      <h1 id="brand-title">Dijital İkiz</h1>
      <p id="brand-sub"></p>
    </div>
  </header>

  <div class="fab-col">
    <button id="panel-toggle" class="fab" aria-controls="panel" aria-expanded="false" title="Katmanlar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2 8l10 5 10-5-10-5Zm-8.2 8.9L2 12.8 12 18l10-5.2-1.8-.9L12 16 3.8 11.9Zm0 4L2 16.8 12 22l10-5.2-1.8-.9L12 20l-8.2-4.1Z"/></svg>
    </button>
    <button id="btn-home" class="fab" title="Görünümü sıfırla">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 3 10.5V21h6v-6h6v6h6V10.5L12 3Z"/></svg>
    </button>
    <button id="btn-top" class="fab" title="Kuşbakışı">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5c-5 0-9 4.5-10 7 1 2.5 5 7 10 7s9-4.5 10-7c-1-2.5-5-7-10-7Zm0 11a4 4 0 1 1 0-8 4 4 0 0 1 0 8Zm0-6a2 2 0 1 0 0 4 2 2 0 0 0 0-4Z"/></svg>
    </button>
  </div>

  <aside id="panel" class="panel" aria-label="Lejant ve katmanlar">
    <div class="panel-head">
      <h2>Katmanlar</h2>
      <button id="panel-close" class="icon-btn" aria-label="Kapat">✕</button>
    </div>
    <div class="search-wrap">
      <input id="search" type="search" placeholder="Yer ara… (ör. Ayasofya, Rumeli Hisarı)" autocomplete="off" enterkeyhint="search">
      <div id="search-results" class="search-results" hidden></div>
    </div>
    <div class="slider-box">
      <div class="slider-label"><span>Yükseklik abartısı</span><output id="exag-val"></output></div>
      <input id="exag" type="range" min="0" max="25" step="0.5" value="8" aria-label="Yükseklik abartısı">
    </div>
    <div id="layer-list" class="layer-list"></div>
    <div class="panel-foot">
      <div class="foot-btns">
        <button id="btn-install" class="btn" hidden>Ana ekrana ekle</button>
        <button id="btn-share" class="btn" hidden>Paylaş</button>
      </div>
      <p id="data-info"></p>
      <p><span id="quality"></span> · Gezinme: tek parmak kaydır, iki parmak yakınlaş/döndür</p>
      <p class="attrib">Harita: © MSB Harita Genel Müdürlüğü · Veri: © OpenStreetMap katkıcıları (ODbL) · Özetler: Vikipedi (CC BY-SA)</p>
    </div>
  </aside>

  <div id="tooltip" class="tooltip" hidden></div>

  <article id="card" class="card" hidden aria-live="polite">
    <button id="card-close" class="icon-btn card-close" aria-label="Kapat">✕</button>
    <div id="card-body" class="card-body"></div>
  </article>

  <div id="toast" class="toast" hidden></div>

  <div id="loader" class="loader">
    <div class="spinner"></div>
    <p id="loader-text">Yükleniyor…</p>
  </div>

  <!-- Veri dosyaları (klasik script: çevrimdışı ve file:// uyumlu) -->
  <script src="data/data.js"></script>
  <script src="data/curated.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
